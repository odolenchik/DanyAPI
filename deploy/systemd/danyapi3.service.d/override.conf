[Service]
# Wait for DNS before the provider probes run. eth0 comes up a few seconds after
# the unit starts, and an auth probe that hits a transport error would otherwise
# mark the token dead; exit 0 in any case, so a slow network never blocks boot.
ExecStartPre=/bin/sh -c 'i=0; while [ $i -lt 30 ]; do getent hosts chat.deepseek.com >/dev/null 2>&1 && exit 0; i=$((i+1)); sleep 2; done; exit 0'

# The Qwen transport drives a headed browser: patchright/Playwright need the X
# display of the desktop session, and the browser binary is named explicitly
# because the bundled revision may not match what patchright expects.
# Adjust the revision to the one present in ~/.cache/ms-playwright.
Environment=DISPLAY=:0
Environment=QWEN_BROWSER_EXECUTABLE=/home/orangepi/.cache/ms-playwright/chromium-1194/chrome-linux/chrome
# How long the window stays open for a human to clear a captcha. On a headless
# deployment leave it at 0 so a request fails fast instead of waiting.
Environment=DANYAPI_QWEN_CAPTCHA_WAIT=0

# The browser needs a writable home for its profile and cache.
Environment=HOME=/home/orangepi

# A headed browser is slower to start and does not tolerate an aggressive kill.
TimeoutStopSec=30
KillSignal=SIGTERM
